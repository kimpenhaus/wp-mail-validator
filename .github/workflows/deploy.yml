name: Deploy to WordPress.org

on:
  # Every published release: by release-please (release.yml) or by hand.
  release:
    types: [published]

permissions:
  contents: write # attach the zip to the GitHub release

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    environment: wordpress.org
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches the plugin version
        run: .github/scripts/check-versions.sh "$TAG"

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-mail-validator
          VERSION: ${{ env.TAG }}

      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.deploy.outputs.zip-path }}" --clobber
