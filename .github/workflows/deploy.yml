name: Deploy to WordPress.org

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write # attach the zip to the GitHub release

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: wordpress.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME}"
          header=$(sed -n 's/^ \* Version: *//p' wp-mail-validator.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "tag=$tag header=$header stable=$stable"
          test "$tag" = "$header" && test "$tag" = "$stable"

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-mail-validator

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.deploy.outputs.zip-path }}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
