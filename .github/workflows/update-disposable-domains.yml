name: Update disposable domain list

on:
  schedule:
    - cron: '17 4 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download list from disposable-email-domains (CC0)
        run: |
          curl -fsSL https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main/disposable_email_blocklist.conf \
            | tr -d '\r' | tr 'A-Z' 'a-z' | sed '/^\s*$/d' > data/disposable-email-domains.txt.new
          # Guard against a broken download replacing the list.
          test "$(wc -l < data/disposable-email-domains.txt.new)" -gt 1000
          mv data/disposable-email-domains.txt.new data/disposable-email-domains.txt
          echo "COUNT=$(wc -l < data/disposable-email-domains.txt | tr -d ' ')" >> "$GITHUB_ENV"

      # PRs opened with the workflow token don't trigger CI, so test the new list here.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/update-disposable-domains
          commit-message: 'chore: update disposable domain list'
          title: 'chore: update disposable domain list'
          body: |
            Monthly update from [disposable-email-domains](https://github.com/disposable-email-domains/disposable-email-domains) (CC0), now ${{ env.COUNT }} domains.

            Unit tests passed with the new list in the workflow run. CI does not start for PRs opened by a workflow, so merge with your admin bypass.

            Ships with the next release.
          labels: blacklist
          delete-branch: true
