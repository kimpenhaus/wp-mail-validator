name: Bug report
description: Something in Mail Validator isn't working as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issues:** please do not open a public issue – use "Report a vulnerability" in the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable "…" in Settings → Mail Validator
        2. Post a comment with the address "…"
        3. …
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.6.5"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "6.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages / debug.log
      description: Anything from `wp-content/debug.log` or the browser console. Remove personal data first.
      render: shell
