<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  /* GitHub's social preview: 1280 × 640, opaque, the banner's look with the name beside two screenshots. */
  .s{width:1280px;height:640px;position:relative;overflow:hidden;
     background:radial-gradient(circle at 85% 15%,#3b82f6 0,transparent 55%),linear-gradient(135deg,#1d4ed8,#1e3a8a);
     font-family:Inter,sans-serif;color:#fff}
  .copy{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
  .copy img{width:112px;height:112px;margin-bottom:32px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
  h1{margin:0;font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
  p{margin:18px 0 26px;font-size:27px;font-weight:500;line-height:1.3;color:#dbeafe}
  .tags{display:flex;gap:10px;flex-wrap:wrap}
  .tags span{font-size:16px;font-weight:700;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
  small{margin-top:30px;font-size:19px;font-weight:500;color:#bfdbfe}
  .shot{position:absolute;border-radius:12px;overflow:hidden;background:#fff;
        box-shadow:0 28px 60px -18px rgba(15,23,42,.65),0 0 0 1px rgba(15,23,42,.2)}
  .bar{height:30px;background:#e2e8f0;display:flex;align-items:center;gap:7px;padding:0 14px}
  .bar i{width:11px;height:11px;border-radius:50%;background:#cbd5e1}
  .view{position:relative;overflow:hidden}
  .view img{display:block;position:absolute}
  .register{left:540px;top:96px}
  .register .view{width:320px;height:400px;background:#f0f0f0}
  .register img{width:800px;left:-240px;top:-132px}
  .contact{left:880px;top:196px}
  .contact .view{width:360px;height:240px}
  .contact img{width:372px;left:0;top:-4px}
</style></head><body>
<div class="s">
  <div class="copy"><img src="icon.svg" alt="">
    <h1>Mail Validator</h1>
    <p>Blocks disposable and fake email addresses in WordPress.</p>
    <div class="tags"><span>Comments</span><span>Registrations</span><span>Contact forms</span></div>
    <small>WordPress plugin · wordpress.org</small>
  </div>
  <div class="shot register"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="/out/screenshot-3.png" alt=""></div></div>
  <div class="shot contact"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="/out/screenshot-2.png" alt=""></div></div>
</div></body></html>
