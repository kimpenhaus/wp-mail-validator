<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  .b{width:772px;height:250px;box-sizing:border-box;padding:0 56px;display:flex;align-items:center;gap:36px;
     background:radial-gradient(circle at 85% 20%,#3b82f6 0,transparent 55%),linear-gradient(135deg,#1d4ed8,#1e3a8a);
     font-family:Inter,sans-serif;color:#fff;overflow:hidden;position:relative}
  .b img{width:150px;height:150px;flex:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
  h1{margin:0;font-size:50px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  p{margin:12px 0 18px;font-size:21px;font-weight:500;color:#dbeafe}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tags span{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<div class="b"><img src="icon.svg" alt="">
  <div><h1>Mail Validator</h1><p>Disposable &amp; fake address blocker</p>
  <div class="tags"><span>Comments</span><span>Registrations</span><span>Contact forms</span></div></div>
</div></body></html>
